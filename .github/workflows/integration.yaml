name: 07 - Friendly Bot

on:
  issues:
    types: [opened]

permissions:
  issues: write                        # only what we need, nothing more

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Reply to the new issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body " Thanks for opening an issue, @${{ github.event.issue.user.login }}!"
name: 04c - Package Delivery

on: workflow_dispatch

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Create some files
        run: |
          mkdir parcel
          echo "secret note " > parcel/note.txt
          echo "<h1>Hi from a build job</h1>" > parcel/page.html

      - name: Upload the folder as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: my-parcel          # label of the package in GitHub storage
          path: parcel/            # what to put in the package

  unpack:
    needs: pack
    runs-on: ubuntu-latest
    steps:
      - name: Look around BEFORE download
        run: ls -la                # empty, fresh VM again

      - name: Download the artifact
        uses: actions/download-artifact@v8
        with:
          name: my-parcel          # must match the upload name
          path: received/          # where to unpack it on this VM

      - name: Read the delivered files
        run: |
          ls -la received/
          cat received/note.txt    #  works this time!